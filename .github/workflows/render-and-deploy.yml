name: Deploy rendered book to GitHub Pages

# Book source (.qmd/.Rmd/custom.scss) is no longer pushed to GitHub, so this
# workflow does NOT run `quarto render` — there is no source in the checkout
# to render. Instead it publishes the already-rendered docs/ folder that you
# commit locally after running `quarto render` on your machine.
#
# One-time setup: in the repo Settings -> Pages, set Source to "GitHub Actions".

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
